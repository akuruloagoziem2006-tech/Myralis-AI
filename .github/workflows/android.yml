name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: myralis-debug-keystore-v1
      - name: Create Android project
            - name: Add native device plugin
        working-directory: android-app
        run: |
          cp native/MyralisDevicePlugin.java android/app/src/main/java/com/myralis/app/
          python3 - <<'PY'
          p = "android/app/src/main/java/com/myralis/app/MainActivity.java"
          s = open(p).read()
          s = s.replace("public class MainActivity extends BridgeActivity {",
            "public class MainActivity extends BridgeActivity {\n  @Override public void onCreate(android.os.Bundle b) { registerPlugin(MyralisDevicePlugin.class); super.onCreate(b); }", 1)
          open(p, "w").write(s)
          m = "android/app/src/main/AndroidManifest.xml"
          t = open(m).read()
          if "SET_ALARM" not in t:
              t = t.replace("<application", '<uses-permission android:name="com.android.alarm.permission.SET_ALARM" />\n    <application', 1)
              open(m, "w").write(t)
          PY
          grep -n "registerPlugin\|SET_ALARM" android/app/src/main/java/com/myralis/app/MainActivity.java android/app/src/main/AndroidManifest.xml 
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|</manifest>|    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n</manifest>|' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission\|cleartext\|queries" android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Myralis.apk
          ls -la ../../Myralis.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Myralis Android APK (latest)
          files: Myralis.apk
          make_latest: true
